services:
  # ============================================================
  # 1. TRAVELZYNC DJANGO BACKEND (Web Service)
  # ============================================================
  - type: web
    name: travelzync-backend
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: "./build.sh"
    startCommand: "gunicorn travelzync_backend.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: ADMIN_DASHBOARD_KEY
        value: travelzync_admin_2026
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.console.EmailBackend
      - key: DATABASE_URL
        fromDatabase:
          name: travelzync-db
          property: connectionString

  # ============================================================
  # 2. TRAVELZYNC REACT FRONTEND (Static Site)
  # ============================================================
  - type: web
    name: travelzync-frontend
    runtime: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: "dist"
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
    envVars:
      - key: VITE_API_BASE_URL
        value: https://travelzync-backend.onrender.com

databases:
  # ============================================================
  # 3. POSTGRESQL DATABASE (Free Tier)
  # ============================================================
  - name: travelzync-db
    region: singapore
    plan: free
